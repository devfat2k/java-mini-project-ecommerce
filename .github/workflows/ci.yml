name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    name: Code Quality & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'          # tự cache ~/.m2, build lần sau nhanh hơn nhiều

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw        # lỗi kinh điển đã note ở Giai đoạn 3 — CI cũng cần dòng này

      - name: Code Quality Gate (PMD)
        run: ./mvnw pmd:check     # fail nhanh, đứng trước test — đúng nguyên tắc "fail fast" đã học ở 4D

      - name: Run tests
        run: ./mvnw clean test

      - name: Build (compile check)
        run: ./mvnw clean package -DskipTests