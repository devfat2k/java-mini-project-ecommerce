spring:
  jpa:
    show-sql: false

  # Neon Free Tier: tối đa 5 concurrent connections — pool size phải <= 5
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

app:
  frontend-url: ${FRONTEND_URL:https://seafood-shop-fe.vercel.app}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://seafood-shop-fe.vercel.app,http://localhost:3000,http://localhost:8085}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN