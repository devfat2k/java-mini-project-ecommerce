spring:
  application:
    name: mini-ecommerce
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/mini_shop
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3600000

  jpa:
    database: postgresql   #mysql
    show-sql: true
    open-in-view: false   # tắt đi, tránh query không kiểm soát trong view layer
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # ============================================================
  # Flyway — quản lý schema version
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public

  mail:
    host: smtp.gmail.com
    port: 587
    username: phathn2688@gmail.com
    password: "ierm ghfr vrgp ojae"
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false

# Cấu hình riêng của ứng dụng — KHÔNG lồng vào "spring:", tránh trùng namespace của framework
app:
  jwt:
    secret-key: p7u+RsHIDcCzWpazxlEjiTF3NTaF65vI2LdWGcYN148=
    expiration: 3600000

# springdoc là namespace độc lập, ngang hàng với "spring:" — không phải "spring.springdoc.*"
springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html

# logging cũng là namespace độc lập, ngang hàng với "spring:"
logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG          # thêm để thấy SQL rõ hơn
    org.hibernate.type: TRACE

