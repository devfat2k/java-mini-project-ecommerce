  #    ============== PostgressSql ===============
  datasource:
    url: jdbc:postgresql://localhost:5432/mini_shop
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    #    database: mysql
    database: postgresql
    show-sql: true
    open-in-view: false   # tắt đi, tránh query không kiểm soát trong view layer
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # ============================================================
  # Flyway — quản lý schema version
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

