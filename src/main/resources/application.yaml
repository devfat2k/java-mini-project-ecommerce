spring:
  application:
    name: mini-ecommerce
  profiles:
    active: prod

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    database: postgresql #mysql
    show-sql: true
    open-in-view: false # tắt đi, tránh query không kiểm soát trong view layer
    hibernate:
      ddl-auto: validate # update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # ============================================================
  # Flyway — quản lý schema version
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: public

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}   # thêm biến, giữ Gmail làm default cho local nếu cần
    port: ${MAIL_PORT:587}               # thêm biến, giữ 587 làm default (Brevo cũng dùng 587)
    username: ${MAIL_USERNAME}           # giữ nguyên — chỉ đổi giá trị trong .env
    password: ${MAIL_PASSWORD}           # giữ nguyên — chỉ đổi giá trị trong .env
    default-encoding: UTF-8
    properties:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false

# server
server:
  port: ${PORT:8085}

# Cấu hình riêng của ứng dụng — KHÔNG lồng vào "spring:", tránh trùng namespace của framework
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8085}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 3600000
    refresh-expiration-days: 7
  upload:
    max-image-size: 5MB
  minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MIN_IO_ACCESS_KEY}
      secret-key: ${MIN_IO_SECRET_KEY}
      bucket: ${MIN_IO_BUCKET}
  mail:
    brevo:
      api-key: ${BREVO_API_KEY:}
  # ============================================================
  # VNPAY Configuration
  # ============================================================
vnpay:
  pay-url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
  tmn-code: ${VNPAY_TMN_CODE}
  secret-key: ${VNPAY_SECRET_KEY}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL}

# springdoc là namespace độc lập, ngang hàng với "spring:" — không phải "spring.springdoc.*"
springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# logging cũng là namespace độc lập, ngang hàng với "spring:"
logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG # thêm để thấy SQL rõ hơn
    org.hibernate.type: TRACE

