spring:
  application:
    name: mini-ecommerce
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    database: postgresql
    open-in-view: false
    hibernate:
      ddl-auto: validate       # luôn validate, KHÔNG auto-generate — Flyway là nguồn sự thật duy nhất, giống nhau cả 2 môi trường
    properties:
      hibernate:
        show-sql: true
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    create-schemas: false
    # repair-on-migrate KHÔNG phải Spring Boot property — bị bỏ qua hoàn toàn.
    # Việc repair được xử lý bởi FlywayConfig bean (FlywayMigrationStrategy).

server:
  port: ${PORT:8085}

app:
  frontend-url: ${FRONTEND_URL:https://seafood-shop-fe.vercel.app}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://seafood-shop-fe.vercel.app,http://localhost:3000,http://localhost:8085}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 3600000
    refresh-expiration-days: 7
  upload:
    max-image-size: 5MB
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-url: ${MINIO_PUBLIC_URL:${app.minio.endpoint}}
    access-key: ${MIN_IO_ACCESS_KEY}
    secret-key: ${MIN_IO_SECRET_KEY}
    bucket: ${MIN_IO_BUCKET}
  mail:
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:}
  scheduler:
    otp-cleanup:
      cron: "${OTP_CLEANUP_CRON:0 0 * * * *}"
    payment-expired:
      cron: "${PAYMENT_EXPIRED_CRON:0 */2 * * * *}"
  rate-limit:
    enabled: true
    rules:
      login:
        capacity: 5
        refill-tokens: 5
        duration-minutes: 15
      otp:
        capacity: 3
        refill-tokens: 3
        duration-minutes: 5
      public-api:
        capacity: 60
        refill-tokens: 60
        duration-minutes: 1

vnpay:
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  tmn-code: ${VNPAY_TMN_CODE}
  secret-key: ${VNPAY_SECRET_KEY}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL}


springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha